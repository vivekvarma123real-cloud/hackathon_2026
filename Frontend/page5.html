<canvas id="shader-canvas-ANIMATION_4" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_4');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

void main() {
    vec2 uv = v_texCoord;
    vec2 center = vec2(0.5, 0.5);
    float d = distance(uv, center);
    
    // Pulsing core
    float pulse = 0.5 + 0.5 * sin(u_time * 3.0);
    float ring = smoothstep(0.3 + pulse * 0.05, 0.31 + pulse * 0.05, d) - smoothstep(0.33 + pulse * 0.05, 0.34 + pulse * 0.05, d);
    
    // Inner glow
    float innerGlow = smoothstep(0.3, 0.0, d);
    
    vec3 color = mix(vec3(0.05, 0.58, 0.53), vec3(0.12, 0.23, 0.54), d); // Teal to Navy
    vec3 finalColor = color * (ring + innerGlow * 0.5);
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

</button>
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] font-label-xl text-label-xl hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 h-full">
<span class="material-symbols-outlined mb-1" data-icon="close">close</span> रद्द करें / Cancel
</button>

<script>
    const initialQuestion = "What is the main problem you are experiencing?";
    
    // Check if complaint was passed, we can optionally use it, but user wants open-ended first question
    let complaint = sessionStorage.getItem('complaint');
    let messages = [
        { role: 'assistant', content: initialQuestion }
    ];

    const qTextEng = document.getElementById('question-text-eng');
    const qTextHin = document.getElementById('question-text-hindi');
    
    const micBtn = document.getElementById('mic-btn');
    const transcriptCard = document.getElementById('transcript-card');
    const transcriptStatus = document.getElementById('transcript-status');
    const transcriptText = document.getElementById('transcript-text');
    const confirmBtn = document.getElementById('confirm-btn');
    const retryBtn = document.getElementById('retry-btn');
    const readAloudBtn = document.getElementById('read-aloud-btn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    // Initialize UI
    qTextEng.textContent = initialQuestion;
    qTextHin.textContent = "कृपया अपनी समस्या बताएं";

    let recognition;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            transcriptCard.classList.remove('hidden');
            transcriptStatus.textContent = "Listening...";
            transcriptText.textContent = "...";
            confirmBtn.classList.add('hidden');
            micBtn.classList.add('animate-pulse');
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            transcriptText.textContent = finalTranscript || interimTranscript;
            
            if (finalTranscript) {
                transcriptStatus.textContent = "You said:";
                confirmBtn.classList.remove('hidden');
                micBtn.classList.remove('animate-pulse');
                checkRedFlags(finalTranscript);
            }
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            transcriptStatus.textContent = "Sorry, I couldn't hear you. Please try again.";
            transcriptText.textContent = "";
            confirmBtn.classList.add('hidden');
            micBtn.classList.remove('animate-pulse');
        };

        recognition.onend = () => {
            micBtn.classList.remove('animate-pulse');
        };
    }

    function checkRedFlags(text) {
        const lower = text.toLowerCase();
        const redFlags = ['severe chest pain', 'difficulty breathing', 'faint', 'unconscious', 'blood', 'severe bleeding'];
        if (redFlags.some(flag => lower.includes(flag))) {
            alert("RED FLAG: Please seek immediate assistance from hospital staff.");
            window.location.href = '#'; 
        }
    }

    function speakText(text) {
        // Try to cancel any ongoing speech to prevent overlap
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }

    // Attempt to speak the initial question (may be blocked by browser policy until user interacts)
    setTimeout(() => { speakText(initialQuestion); }, 500);

    async function loadNextQuestion() {
        loadingText.textContent = "Generating question...";
        loadingOverlay.classList.remove('hidden');

        try {
            const res = await fetch('http://localhost:8000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages })
            });
            const data = await res.json();
            
            loadingOverlay.classList.add('hidden');
            
            if (data.reply === "[DONE]" || data.reply.includes("[DONE]")) {
                finishInterview();
            } else {
                qTextEng.textContent = data.reply;
                qTextHin.textContent = "कृपया अपनी समस्या बताएं"; // Generic label
                speakText(data.reply);
                transcriptCard.classList.add('hidden');
                transcriptText.textContent = "";
                
                // Add Assistant question to messages array
                messages.push({ role: 'assistant', content: data.reply });
            }
        } catch (e) {
            alert("Error communicating with AI backend.");
            loadingOverlay.classList.add('hidden');
        }
    }

    async function finishInterview() {
        loadingText.textContent = "Generating Clinical Summary...";
        loadingOverlay.classList.remove('hidden');

        try {
            const res = await fetch('http://localhost:8000/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: messages
                })
            });
            const data = await res.json();
            sessionStorage.setItem('finalSummary', data.summary);
            window.location.href = 'page7.html';
        } catch (e) {
            alert("Error generating summary. Please ensure FastAPI and Ollama are running.");
            loadingOverlay.classList.add('hidden');
        }
    }

    micBtn.addEventListener('click', () => {
        if (recognition) {
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already started
            }
        } else {
            alert("Speech recognition not supported in this browser.");
        }
    });

    retryBtn.addEventListener('click', () => {
        if (recognition) {
            try {
                recognition.start();
            } catch (e) {}
        }
    });

    if (readAloudBtn) {
        readAloudBtn.addEventListener('click', () => {
            speakText(qTextEng.textContent);
        });
    }

    confirmBtn.addEventListener('click', () => {
        const answer = transcriptText.textContent;

        messages.push({ role: 'user', content: answer });
        
        loadNextQuestion();
    });

</script>
