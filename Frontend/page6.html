<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guided Medical Questions</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 32px; /* Set a default size suitable for large touch targets */
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#dae2fd",
                        "surface": "#faf8ff",
                        "on-secondary-fixed": "#00201d",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary-fixed-variant": "#005049",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container": "#eaedff",
                        "on-surface-variant": "#444651",
                        "surface-bright": "#faf8ff",
                        "on-background": "#131b2e",
                        "on-surface": "#131b2e",
                        "on-primary-container": "#90a8ff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-tertiary-container": "#aaadaf",
                        "on-tertiary-fixed-variant": "#444749",
                        "primary-fixed": "#dce1ff",
                        "tertiary": "#272b2d",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-fixed": "#89f5e7",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary": "#006a61",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#b6c4ff",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-tint": "#4059aa",
                        "outline-variant": "#c5c5d3",
                        "inverse-on-surface": "#eef0ff",
                        "inverse-surface": "#283044",
                        "primary-container": "#1e3a8a",
                        "primary": "#00236f",
                        "on-secondary-container": "#006f66",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "surface-container-high": "#e2e7ff",
                        "on-primary-fixed": "#00164e",
                        "error-container": "#ffdad6",
                        "secondary-container": "#86f2e4",
                        "surface-variant": "#dae2fd",
                        "tertiary-container": "#3d4143",
                        "inverse-primary": "#b6c4ff",
                        "surface-dim": "#d2d9f4",
                        "outline": "#757682",
                        "on-error": "#ffffff",
                        "background": "#faf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "touch-target-min": "64px",
                        "stack-lg": "48px",
                        "margin-page": "40px",
                        "gutter": "24px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["56px", { "lineHeight": "68px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "42px", "fontWeight": "700" }],
                        "label-xl": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-lg": ["24px", { "lineHeight": "36px", "fontWeight": "500" }],
                        "headline-lg": ["40px", { "lineHeight": "52px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container flex flex-col">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest dark:bg-surface-container-lowest border-b-2 border-outline-variant flex justify-between items-center px-margin-page h-[80px]">
<div class="flex items-center gap-gutter">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">
                National Hospital OPD
            </h1>
</div>
<div class="flex items-center gap-stack-sm">
<!-- Trailing Icons converted to large touch targets -->
<button aria-label="Emergency Home" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-lg border-2 border-transparent hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
</button>
<button aria-label="Account Balance Wallet" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-lg border-2 border-transparent hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[100px] pb-[120px] px-margin-page flex flex-col items-center">
<div class="w-full max-w-7xl flex flex-col lg:flex-row gap-stack-lg mt-stack-md">
<!-- Left Panel: Body Map -->
<div class="w-full lg:w-1/3 flex flex-col gap-stack-md">
<div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-stack-md flex flex-col h-full shadow-sm">
<div class="flex justify-between items-center mb-stack-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Area of Concern</h2>
<button aria-label="Listen to Area of Concern instruction" class="h-[64px] min-w-[64px] px-4 rounded-lg bg-primary text-on-primary flex items-center justify-center gap-2 border-2 border-transparent active:border-secondary transition-all">
<span class="material-symbols-outlined">volume_up</span>
<span class="font-label-lg text-label-lg hidden sm:inline">सुनिए</span>
</button>
</div>
<!-- High-fidelity 2D Body Map Container -->
<div class="relative flex-grow rounded-lg border-2 border-surface-variant overflow-hidden bg-surface-container-low min-h-[500px] flex items-center justify-center">
<img class="object-contain w-full h-full max-h-[600px] p-4" data-alt="A clean, high-contrast 2D medical illustration of a human body front view on a white background. The chest area is prominently highlighted in a bold, solid deep blue color (#00236f) with a thick outline to indicate selection. The rest of the body outline (head, abdomen, limbs) is in a subdued dark grey. Clinical, trustworthy, clear vector style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzd90R1YU-bJYY_XyUvLji42TUfl8-BrHNj-3yce5CooVwzIEG4oCcQc4HjMeQ2aO3dkAc92LJg99NefwGWRrs8yomWUtvA7BIfxK9REHUPeHGKe9FOPMbRwtHNA3CVrBWLE8nYDrpgpQEjymABvnAd0_d8hA8GIY4gzcd33e6RSd_T2vWfnRaC4Z91DCg3H4zK4nv4SkQC3lAXTEMxkQR2uzIOPcllK69XY_rgJc83FO8CrFWjaIMHA"/>
<!-- Overlay Labels for context (simulated interactive zones) -->
<div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-8">
<div class="text-center font-label-xl text-label-xl text-outline mt-4">Head</div>
<div class="text-center font-headline-md text-headline-md text-primary font-bold bg-primary-container/20 px-4 py-2 rounded-full inline-block self-center border-2 border-primary">Chest</div>
<div class="text-center font-label-xl text-label-xl text-outline mb-12">Abdomen</div>
<div class="text-center font-label-xl text-label-xl text-outline absolute bottom-12 left-12">Limbs</div>
</div>
</div>
</div>
</div>
<!-- Right Panel: Structured Question Cards -->
<div class="w-full lg:w-2/3 flex flex-col gap-stack-lg">
<!-- Question 1 Card -->
<div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-stack-md shadow-sm">
<div class="flex justify-between items-start mb-stack-md gap-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                            How long has it been hurting?
                        </h2>
<button aria-label="Listen to Question 1" class="h-touch-target-min min-w-[64px] px-4 rounded-lg bg-primary text-on-primary flex items-center justify-center gap-2 border-2 border-transparent active:border-secondary transition-all shrink-0">
<span class="material-symbols-outlined">volume_up</span>
<span class="font-label-lg text-label-lg hidden sm:inline">सुनिए</span>
</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-stack-sm">
<button class="h-[80px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">
                            < 1 Day
                        </button>
<!-- Selected State -->
<button class="h-[80px] rounded-lg border-4 border-primary bg-primary-container text-on-primary-container font-label-xl text-label-xl hover:bg-primary-container/80 transition-all flex items-center justify-center relative shadow-inner">
                            2-3 Days
                            <!-- Indicator icon for extra clarity -->
<span class="material-symbols-outlined absolute top-2 right-2 text-primary text-[24px]">check_circle</span>
</button>
<button class="h-[80px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">
                            1+ Week
                        </button>
</div>
</div>
<!-- Question 2 Card -->
<div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-stack-md shadow-sm flex-grow">
<div class="flex justify-between items-start mb-stack-md gap-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                            How bad is the pain?
                        </h2>
<button aria-label="Listen to Question 2" class="h-touch-target-min min-w-[64px] px-4 rounded-lg bg-primary text-on-primary flex items-center justify-center gap-2 border-2 border-transparent active:border-secondary transition-all shrink-0">
<span class="material-symbols-outlined">volume_up</span>
<span class="font-label-lg text-label-lg hidden sm:inline">सुनिए</span>
</button>
</div>
<!-- Visual Pain Scale -->
<div class="flex flex-col gap-4 w-full">
<div class="flex justify-between px-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_very_dissatisfied</span>
</div>
<div class="grid grid-cols-5 lg:grid-cols-10 gap-2">
<!-- 1 to 10 Scale Buttons -->
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">1</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">2</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">3</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">4</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">5</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">6</button>
<!-- Selected Pain Level -->
<button class="h-[64px] rounded-lg border-4 border-primary bg-primary-container text-on-primary-container font-label-xl text-label-xl hover:bg-primary-container/80 transition-all flex items-center justify-center shadow-inner relative">
                                7
                            </button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">8</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">9</button>
<button class="h-[64px] rounded-lg border-2 border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-xl text-label-xl hover:bg-surface-container-high active:bg-surface-container-highest transition-all flex items-center justify-center">10</button>
</div>
<div class="flex justify-between px-2 mt-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">Mild</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Severe</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (From JSON) - All items inactive as this is a task flow -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-primary dark:bg-primary border-t-4 border-secondary flex justify-between items-stretch h-[100px] px-margin-page">
<!-- Item 1: Back -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 mt-auto mb-auto rounded-lg px-4 py-2">
<span class="material-symbols-outlined mb-1">arrow_back</span>
<span class="font-label-xl text-label-xl whitespace-nowrap">वापस / Back</span>
</button>
<!-- Item 2: Help -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 mt-auto mb-auto rounded-lg px-4 py-2">
<span class="material-symbols-outlined mb-1">call</span>
<span class="font-label-xl text-label-xl whitespace-nowrap">सहायता / Help</span>
</button>
<!-- Item 3: Cancel -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 mt-auto mb-auto rounded-lg px-4 py-2">
<span class="material-symbols-outlined mb-1">close</span>
<span class="font-label-xl text-label-xl whitespace-nowrap">रद्द करें / Cancel</span>
</button>
</footer>
</body></html>
