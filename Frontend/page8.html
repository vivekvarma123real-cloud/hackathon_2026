<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>National Hospital OPD - Document Upload &amp; Scanning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#dae2fd",
                        "surface": "#faf8ff",
                        "on-secondary-fixed": "#00201d",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "on-secondary-fixed-variant": "#005049",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container": "#eaedff",
                        "on-surface-variant": "#444651",
                        "surface-bright": "#faf8ff",
                        "on-background": "#131b2e",
                        "on-surface": "#131b2e",
                        "on-primary-container": "#90a8ff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-tertiary-container": "#aaadaf",
                        "on-tertiary-fixed-variant": "#444749",
                        "primary-fixed": "#dce1ff",
                        "tertiary": "#272b2d",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-fixed": "#89f5e7",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary": "#006a61",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#b6c4ff",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-tint": "#4059aa",
                        "outline-variant": "#c5c5d3",
                        "inverse-on-surface": "#eef0ff",
                        "inverse-surface": "#283044",
                        "primary-container": "#1e3a8a",
                        "primary": "#00236f",
                        "on-secondary-container": "#006f66",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#264191",
                        "surface-container-high": "#e2e7ff",
                        "on-primary-fixed": "#00164e",
                        "error-container": "#ffdad6",
                        "secondary-container": "#86f2e4",
                        "surface-variant": "#dae2fd",
                        "tertiary-container": "#3d4143",
                        "inverse-primary": "#b6c4ff",
                        "surface-dim": "#d2d9f4",
                        "outline": "#757682",
                        "on-error": "#ffffff",
                        "background": "#faf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "touch-target-min": "64px",
                        "stack-lg": "48px",
                        "margin-page": "40px",
                        "gutter": "24px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["56px", { "lineHeight": "68px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "42px", "fontWeight": "700" }],
                        "label-xl": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-lg": ["24px", { "lineHeight": "36px", "fontWeight": "500" }],
                        "headline-lg": ["40px", { "lineHeight": "52px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col text-on-background relative">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest dark:bg-surface-container-lowest border-b-2 border-outline-variant hidden md:flex flex justify-between items-center w-full px-margin-page h-[80px] z-50">
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">
            National Hospital OPD
        </div>
<div class="flex items-center gap-4">
<button aria-label="Home" class="h-touch-target-min min-w-[64px] flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none">
<span class="material-symbols-outlined text-primary text-[32px]">emergency_home</span>
</button>
<button aria-label="Wallet" class="h-touch-target-min min-w-[64px] flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none">
<span class="material-symbols-outlined text-primary text-[32px]">account_balance_wallet</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col md:flex-row p-margin-page gap-stack-lg mb-[100px] md:mb-0 pb-margin-page">
<!-- Left Sidebar / Vertical Tabs -->
<aside class="w-full md:w-1/3 lg:w-1/4 flex flex-col gap-stack-md">
<div class="font-headline-lg text-headline-lg text-primary mb-stack-sm">
                Document Scanning
            </div>
<nav class="flex flex-col gap-stack-sm">
<!-- Active Tab -->
<button class="h-touch-target-min bg-primary-container text-on-primary-container rounded-xl flex items-center px-6 gap-4 border-2 border-primary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">prescriptions</span>
<span class="font-label-xl text-label-xl flex-grow text-left">Scan Prescription</span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
<!-- Inactive Tabs -->
<button class="h-touch-target-min bg-surface text-on-surface rounded-xl flex items-center px-6 gap-4 border-2 border-outline-variant hover:border-primary transition-colors focus:ring-4 focus:ring-primary focus:outline-none">
<span class="material-symbols-outlined text-[28px]">biotech</span>
<span class="font-label-xl text-label-xl flex-grow text-left">Lab Test Report</span>
</button>
<button class="h-touch-target-min bg-surface text-on-surface rounded-xl flex items-center px-6 gap-4 border-2 border-outline-variant hover:border-primary transition-colors focus:ring-4 focus:ring-primary focus:outline-none">
<span class="material-symbols-outlined text-[28px]">description</span>
<span class="font-label-xl text-label-xl flex-grow text-left">Discharge Summary</span>
</button>
</nav>
</aside>
<!-- Right Content Area: Camera Preview & Thumbnails -->
<section class="w-full md:w-2/3 lg:w-3/4 flex flex-col gap-stack-lg">
<!-- Camera Preview Viewport -->
<div class="relative w-full h-[500px] bg-black rounded-2xl overflow-hidden border-4 border-primary shadow-lg flex items-center justify-center">
<!-- Placeholder for actual camera feed -->
<img class="absolute inset-0 w-full h-full object-cover opacity-60" data-alt="A simulated camera viewport showing a generic medical prescription document placed on a clean white desk, viewed from directly above. The scene is brightly lit with clinical hospital lighting, highlighting the document edges. The overall aesthetic is highly functional, crisp, and high-contrast, fitting a trustworthy medical interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAItIjBs8dCFcbbcqUeEYZXV5ay42BcY8L6isc_wFNBFbA5IwinR3GpATESSyY9q5lFAVP6VGk1QChK6RtZW7SC7v0VCYf3824gORQdvvrr4XerussAvCfaoYNE5tQBw_YDp4kdHbmsP04QGDZL5L2K1LmL_7Oey6guIknQm0dw7GPSuBgoznpiuikvnrnkdwxgfKvsJUSp02TqkKvZ-SkZNlbNpvIy1lNFhvQX3S19QZGA01-grUbimA"/>
<!-- Alignment Guides -->
<div class="absolute inset-4 border-2 border-dashed border-secondary-fixed rounded-lg pointer-events-none"></div>
<div class="absolute top-8 left-8 w-16 h-16 border-t-4 border-l-4 border-secondary pointer-events-none"></div>
<div class="absolute top-8 right-8 w-16 h-16 border-t-4 border-r-4 border-secondary pointer-events-none"></div>
<div class="absolute bottom-8 left-8 w-16 h-16 border-b-4 border-l-4 border-secondary pointer-events-none"></div>
<div class="absolute bottom-8 right-8 w-16 h-16 border-b-4 border-r-4 border-secondary pointer-events-none"></div>
<!-- Scanning Instruction overlay -->
<div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-surface/90 text-on-surface px-8 py-4 rounded-full font-label-xl text-label-xl border-2 border-outline text-center shadow-md">
                    Align document within frame
                </div>
<!-- Capture Button overlay -->
<button aria-label="Capture Document" class="absolute bottom-[-32px] left-1/2 transform -translate-x-1/2 h-24 w-24 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-4 focus:ring-primary focus:outline-none border-4 border-surface z-10">
<span class="material-symbols-outlined text-[40px]">camera</span>
</button>
</div>
<!-- Scanned Thumbnails Carousel -->
<div class="w-full bg-surface-container-low p-6 rounded-2xl border-2 border-outline-variant flex gap-stack-md overflow-x-auto items-center min-h-[160px]">
<!-- Thumbnail 1 -->
<div class="relative min-w-[100px] h-[120px] rounded-lg border-2 border-outline overflow-hidden flex-shrink-0 group">
<img class="w-full h-full object-cover" data-alt="A small thumbnail image of a clearly scanned medical prescription page, high contrast, black text on white paper, clinical look." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwP4K_wgmWVv6sYg4aQ2HM4HExio-K6uAUhDH1p8BgPHcBXEnUn9VkfcShX2d3sfDSIc3fFZH8zxhyNXT66TxN8IyedcnAjU_dgNt_rN_0DWFKszKIw6ne1OVVFnhk_-p_toqdjXU5tK5f4fD5-SfnVLGuk9bD2qP02qewVK5IiLhvLBMQppIEGmsdYCqE4RuY7qBIqKo6Yg7a5xXaGS5lRqRvd9bFEi4-Y8PqTjcjLXa31BMvZ_9tmw"/>
<button aria-label="Delete" class="absolute top-1 right-1 bg-error text-on-error rounded-full w-8 h-8 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100 focus:ring-2 focus:ring-error">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<div class="absolute bottom-0 w-full bg-surface/80 text-on-surface text-center font-label-lg text-sm py-1 border-t border-outline">
                        Page 1
                    </div>
</div>
<!-- Add More Button -->
<button class="min-w-[100px] h-[120px] rounded-lg border-4 border-dashed border-primary flex flex-col items-center justify-center text-primary hover:bg-primary-container hover:text-on-primary-container transition-colors focus:ring-4 focus:ring-primary focus:outline-none flex-shrink-0">
<span class="material-symbols-outlined text-[32px] mb-2">add_circle</span>
<span class="font-label-lg text-label-lg text-sm">Add More</span>
</button>
</div>
<!-- Process Action -->
<div class="flex justify-end w-full">
<button class="h-touch-target-min bg-secondary text-on-secondary px-12 rounded-xl font-label-xl text-label-xl flex items-center gap-4 hover:bg-on-secondary-container hover:text-white transition-colors focus:ring-4 focus:ring-secondary focus:outline-none shadow-sm border-2 border-transparent">
                    Process Documents
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only based on platform pivot rules, but instructions say incorporate so rendering it with its specific classes) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-between items-stretch h-[100px] px-margin-page bg-primary dark:bg-primary border-t-4 border-secondary">
<button aria-label="Back" class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75">
<span class="material-symbols-outlined text-[32px] mb-1">arrow_back</span>
<span class="font-label-xl text-label-xl text-sm">वापस / Back</span>
</button>
<button aria-label="Help" class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75">
<span class="material-symbols-outlined text-[32px] mb-1">call</span>
<span class="font-label-xl text-label-xl text-sm">सहायता / Help</span>
</button>
<!-- Assume 'Cancel' is active logically if they want to cancel out of the modal/scan, but for general nav let's keep all inactive stylings as this isn't a primary tab selection in the bottom nav, just actions. Actually, JSON says style_active_navigation is for selected tab. None are strictly 'active tabs' here, they are actions. Keeping all inactive style. -->
<button aria-label="Cancel" class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75">
<span class="material-symbols-outlined text-[32px] mb-1">close</span>
<span class="font-label-xl text-label-xl text-sm">रद्द करें / Cancel</span>
</button>
</nav>
</body></html>
