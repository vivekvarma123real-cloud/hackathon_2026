<body class="bg-background text-on-background min-h-screen flex flex-col pt-[80px] pb-[100px]">

    <nav

    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col items-center justify-center px-margin-page py-stack-lg pr-[300px]">
        <!-- Welcome Section -->
        <div class="text-center mb-stack-lg w-full max-w-4xl relative">
            <div
                class="absolute inset-0 z-0 opacity-20 pointer-events-none flex items-center justify-center h-32 -top-4">
                <!-- STITCH_SHADER_START:ANIMATION_3 class="w-full h-full" -->
                <div class="w-full h-full" style="display:block;">
                    <canvas id="shader-canvas-ANIMATION_3" style="display:block;width:100%;height:100%"></canvas>
                    <script>
                            (function () {
                                const canvas = document.getElementById('shader-canvas-ANIMATION_3');

                                // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
                                // This fires on initial layout and whenever the element is resized.
                                function syncSize() {
                                    const w = canvas.clientWidth || 1280;
                                    const h = canvas.clientHeight || 720;
                                    if (canvas.width !== w || canvas.height !== h) {
                                        canvas.width = w;
                                        canvas.height = h;
                                    }
                                }
                                if (typeof ResizeObserver !== 'undefined') {
                                    new ResizeObserver(syncSize).observe(canvas);
                                }
                                syncSize();

                                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                                if (!gl) return;
                                const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
                                const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    float wave = sin(uv.x * 20.0 + u_time * 5.0) * 0.1;
    float dist = abs(uv.y - 0.5 + wave);
    float glow = 0.05 / dist;
    
    vec3 color = vec3(0.05, 0.58, 0.53); // Teal #0D9488 normalized
    color *= glow;
    
    // Fade out edges
    float mask = smoothstep(0.0, 0.2, uv.x) * smoothstep(1.0, 0.8, uv.x);
    gl_FragColor = vec4(color * mask, 1.0);
}`;
                                function cs(type, src) {
                                    const s = gl.createShader(type);
                                    gl.shaderSource(s, src);
                                    gl.compileShader(s);
                                    return s;
                                }
                                const prog = gl.createProgram();
                                gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
                                gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
                                gl.linkProgram(prog);
                                gl.useProgram(prog);
                                const buf = gl.createBuffer();
                                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
                                const pos = gl.getAttribLocation(prog, 'a_position');
                                gl.enableVertexAttribArray(pos);
                                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                                const uTime = gl.getUniformLocation(prog, 'u_time');
                                const uRes = gl.getUniformLocation(prog, 'u_resolution');
                                const uMouse = gl.getUniformLocation(prog, 'u_mouse');

                                // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
                                // Shaders that need normalized coords should use: u_mouse / u_resolution.
                                let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
                                window.addEventListener('mousemove', (event) => {
                                    const rect = canvas.getBoundingClientRect();
                                    if (rect.width && rect.height) {
                                        const nx = (event.clientX - rect.left) / rect.width;
                                        const ny = 1.0 - (event.clientY - rect.top) / rect.height;
                                        mouse.x = nx * canvas.width;
                                        mouse.y = ny * canvas.height;
                                    }
                                });

                                function render(t) {
                                    if (typeof ResizeObserver === 'undefined') syncSize();
                                    gl.viewport(0, 0, canvas.width, canvas.height);
                                    if (uTime) gl.uniform1f(uTime, t * 0.001);
                                    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
                                    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
                                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                                    requestAnimationFrame(render);
                                }
                                render(0);
                            })();
                    </script>
                </div>
                <!-- STITCH_SHADER_END:ANIMATION_3 -->
            </div>

                <div class="flex items-center gap-6">

            <!-- Telugu -->
            <button

                <div class="flex items-center gap-6">
                    <div
                        class="w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center text-[32px]">
                        🇮🇳</div>
                    <span class="font-headline-lg text-headline-lg text-on-surface">తెలుగు</span>
                </div>
                <span
                    class="material-symbols-outlined text-[48px] text-primary bg-primary-container/10 p-3 rounded-full">volume_up</span>
            </button>
            <!-- Marathi -->
            <button
                class="bg-surface-container-lowest border-2 border-outline-variant hover:border-primary focus:border-[4px] focus:border-primary rounded-xl p-6 h-[160px] flex items-center justify-between transition-all hover:bg-surface-container hover:shadow-md active:scale-[0.98]">
                <div class="flex items-center gap-6">
                    <div
                        class="w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center text-[32px]">
                        🇮🇳</div>
                    <span class="font-headline-lg text-headline-lg text-on-surface">मराठी</span>
                </div>
                <span
                    class="material-symbols-outlined text-[48px] text-primary bg-primary-container/10 p-3 rounded-full">volume_up</span>
            </button>
        </div>
    </main>
