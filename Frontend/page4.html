<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>National Hospital OPD - Intake</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<!-- Tailwind Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#dae2fd",
                    "surface": "#faf8ff",
                    "on-secondary-fixed": "#00201d",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f2f3ff",
                    "on-secondary-fixed-variant": "#005049",
                    "tertiary-fixed-dim": "#c4c7c9",
                    "surface-container": "#eaedff",
                    "on-surface-variant": "#444651",
                    "surface-bright": "#faf8ff",
                    "on-background": "#131b2e",
                    "on-surface": "#131b2e",
                    "on-primary-container": "#90a8ff",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#6bd8cb",
                    "on-tertiary-container": "#aaadaf",
                    "on-tertiary-fixed-variant": "#444749",
                    "primary-fixed": "#dce1ff",
                    "tertiary": "#272b2d",
                    "on-tertiary-fixed": "#191c1e",
                    "secondary-fixed": "#89f5e7",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "secondary": "#006a61",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#b6c4ff",
                    "tertiary-fixed": "#e0e3e5",
                    "surface-tint": "#4059aa",
                    "outline-variant": "#c5c5d3",
                    "inverse-on-surface": "#eef0ff",
                    "inverse-surface": "#283044",
                    "primary-container": "#1e3a8a",
                    "primary": "#00236f",
                    "on-secondary-container": "#006f66",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#264191",
                    "surface-container-high": "#e2e7ff",
                    "on-primary-fixed": "#00164e",
                    "error-container": "#ffdad6",
                    "secondary-container": "#86f2e4",
                    "surface-variant": "#dae2fd",
                    "tertiary-container": "#3d4143",
                    "inverse-primary": "#b6c4ff",
                    "surface-dim": "#d2d9f4",
                    "outline": "#757682",
                    "on-error": "#ffffff",
                    "background": "#faf8ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "touch-target-min": "48px",
                    "stack-lg": "24px",
                    "margin-page": "24px",
                    "gutter": "16px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-xl": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-lg": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-xl": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background font-sans antialiased overflow-hidden select-none">
<!-- TopAppBar from JSON -->
<header class="fixed bg-surface-container-lowest text-primary docked full-width top-0 border-b-2 border-outline-variant flat no shadows flex justify-between items-center w-full px-margin-page h-[80px] z-50">
<div class="flex items-center gap-gutter">
<h1 class="font-headline-md text-headline-md font-bold text-primary">National Hospital OPD</h1>
</div>
<div class="flex items-center gap-gutter">
<!-- Trailing Icons -->
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="emergency_home">emergency_home</span>
</button>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-100 touch-none">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="account_balance_wallet">account_balance_wallet</span>
</button>
</div>
</header>
<!-- Main Canvas Content -->
<!-- Padding accounts for top and bottom fixed bars + safe zones -->
<main class="absolute top-[80px] bottom-[100px] left-0 right-0 overflow-y-auto px-margin-page py-stack-md flex flex-col gap-stack-lg">
<!-- Header -->
<header class="max-w-4xl">
<h2 class="font-display-lg text-display-lg text-on-surface">What brings you to the hospital today?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-stack-sm">Select a department or a common symptom below.</p>
</header>
<!-- Primary Pathway Cards (Bento-ish Grid) -->
<section class="grid grid-cols-1 lg:grid-cols-2 gap-gutter max-w-6xl">
<!-- Modern Allopathic Card -->
<button class="group flex flex-col items-start justify-between p-stack-md bg-primary-container border-2 border-transparent focus:border-4 focus:border-primary rounded-xl text-left min-h-[160px] hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]">
<div class="w-full flex justify-between items-start">
<div class="w-[48px] h-[48px] bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined filled text-[24px] text-on-primary" data-icon="local_hospital">local_hospital</span>
</div>
<span class="material-symbols-outlined text-[24px] text-on-primary-container opacity-50 group-hover:opacity-100 transition-opacity" data-icon="arrow_forward">arrow_forward</span>
</div>
<div class="mt-auto">
<h3 class="font-headline-lg text-headline-lg text-on-primary-container">Modern Allopathic Medicine</h3>
<p class="font-body-lg text-body-lg text-primary-fixed-dim mt-2">General OPD, Specialists, and Surgery.</p>
</div>
</button>
<!-- AYUSH Card -->
<button class="group flex flex-col items-start justify-between p-stack-md bg-secondary-container border-2 border-transparent focus:border-4 focus:border-secondary rounded-xl text-left min-h-[160px] hover:brightness-95 transition-colors active:scale-[0.98]">
<div class="w-full flex justify-between items-start">
<div class="w-[48px] h-[48px] bg-secondary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined filled text-[24px] text-on-secondary" data-icon="eco">eco</span>
</div>
<div class="bg-secondary text-on-secondary px-4 py-2 rounded-full font-label-lg text-label-lg uppercase tracking-wider">
                        Holistic
                    </div>
</div>
<div class="mt-auto">
<h3 class="font-headline-lg text-headline-lg text-on-secondary-container">AYUSH / Ayurvedic OPD</h3>
<p class="font-body-lg text-body-lg text-on-secondary-fixed-variant mt-2">Traditional Indian medicine and holistic therapies.</p>
</div>
</button>
</section>
<!-- Common Complaints Grid -->
<section class="max-w-6xl mt-stack-md">
<h3 class="font-headline-md text-headline-md text-on-surface mb-stack-md">Common Complaints</h3>
<div class="flex flex-wrap gap-gutter">
<script>
    function startInterview(complaint) {
        sessionStorage.setItem('complaint', complaint);
        window.location.href = 'page5.html';
    }
</script>
<!-- Pills -->
<button onclick="startInterview('fever')" class="h-touch-target-min px-8 bg-surface-container-high border-2 border-outline-variant rounded-full font-label-xl text-label-xl text-on-surface flex items-center gap-4 hover:bg-surface-variant hover:border-outline focus:border-4 focus:border-primary active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="thermostat">thermostat</span>
                    Fever
                </button>
<button onclick="startInterview('chest_pain')" class="h-touch-target-min px-8 bg-surface-container-high border-2 border-outline-variant rounded-full font-label-xl text-label-xl text-on-surface flex items-center gap-4 hover:bg-surface-variant hover:border-outline focus:border-4 focus:border-primary active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="pulmonology">pulmonology</span>
                    Chest Pain
                </button>
<button onclick="startInterview('cough')" class="h-touch-target-min px-8 bg-surface-container-high border-2 border-outline-variant rounded-full font-label-xl text-label-xl text-on-surface flex items-center gap-4 hover:bg-surface-variant hover:border-outline focus:border-4 focus:border-primary active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="sick">sick</span>
                    Cough
                </button>
<button onclick="startInterview('cold')" class="h-touch-target-min px-8 bg-surface-container-high border-2 border-outline-variant rounded-full font-label-xl text-label-xl text-on-surface flex items-center gap-4 hover:bg-surface-variant hover:border-outline focus:border-4 focus:border-primary active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="ac_unit">ac_unit</span>
                    Cold
                </button>
<button class="h-touch-target-min px-8 bg-surface-container-lowest border-2 border-outline border-dashed rounded-full font-label-xl text-label-xl text-on-surface flex items-center gap-4 hover:bg-surface-container hover:border-solid focus:border-4 focus:border-primary active:scale-[0.98] transition-all">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Other / Enter Manually
                </button>
</div>
</section>
<!-- Microphone Banner Call to Action -->
<section class="max-w-6xl mt-auto pb-stack-md pt-stack-lg">
<button onclick="startInterview('')" class="w-full bg-primary text-on-primary rounded-xl flex items-center justify-center p-stack-md border-4 border-transparent hover:brightness-110 focus:border-secondary active:scale-[0.99] transition-all group shadow-lg">
<div class="flex items-center gap-stack-md">
<div class="w-[48px] h-[48px] bg-on-primary rounded-full flex items-center justify-center group-hover:animate-pulse">
<span class="material-symbols-outlined filled text-[24px] text-primary" data-icon="mic">mic</span>
</div>
<div class="text-left">
<span class="block font-headline-lg text-headline-lg">Tap or Speak your problem</span>
<span class="block font-body-lg text-body-lg text-primary-fixed opacity-90">Our AI assistant will guide you to the right department.</span>
</div>
</div>
</button>
</section>
</main>
<!-- BottomNavBar from JSON -->
<nav class="bg-primary fixed bottom-0 left-0 w-full z-50 flex justify-between items-stretch h-[100px] px-margin-page border-t-4 border-secondary flat no shadows">
<!-- Rendering all as inactive since none represent the "current" destination state perfectly, they are persistent controls -->
<!-- Back Button -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 h-full">
<span class="material-symbols-outlined text-[32px] mb-1" data-icon="arrow_back">arrow_back</span>
<span class="font-label-xl text-label-xl">वापस / Back</span>
</button>
<!-- Help Button -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 h-full">
<span class="material-symbols-outlined text-[32px] mb-1" data-icon="call">call</span>
<span class="font-label-xl text-label-xl">सहायता / Help</span>
</button>
<!-- Cancel Button -->
<button class="text-on-primary h-touch-target-min flex flex-col items-center justify-center min-w-[120px] hover:bg-primary-container hover:text-on-primary-container transition-all active:ring-4 active:ring-secondary-fixed duration-75 h-full">
<span class="material-symbols-outlined text-[32px] mb-1" data-icon="close">close</span>
<span class="font-label-xl text-label-xl">रद्द करें / Cancel</span>
</button>
</nav>
</body></html>
